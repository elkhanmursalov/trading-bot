# Publishes the React widget to GitHub Packages when a tag like widget-v0.1.0 is pushed.
name: Publish widget

on:
  push:
    tags:
      - "widget-v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
          registry-url: https://npm.pkg.github.com
          scope: "@elkhanmursalov"

      - run: pnpm install --frozen-lockfile

      # The tag must match the package version, so a release cannot publish the wrong number.
      - name: Check tag matches version
        working-directory: web/packages/crypto-trading-widget
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "widget-v${version}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package version ${version}"
            exit 1
          fi

      - run: pnpm typecheck
      - run: pnpm build

      - name: Publish
        working-directory: web/packages/crypto-trading-widget
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
